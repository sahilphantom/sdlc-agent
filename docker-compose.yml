name: sdlc-agent

services:

  # ── PostgreSQL — primary datastore ──────────────────────────
  postgres:
    image: pgvector/pgvector:pg16    # includes pgvector extension
    container_name: sdlc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sdlc
      POSTGRES_PASSWORD: sdlc_pass
      POSTGRES_DB: sdlc_agent
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdlc -d sdlc_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis — Celery broker + session state ───────────────────
  redis:
    image: redis:7-alpine
    container_name: sdlc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Qdrant — vector database for agent memory ───────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sdlc-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Prometheus — metrics collection ─────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: sdlc-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          memory: 256m

  # ── Grafana — metrics dashboard ──────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: sdlc-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"   # 3001 on host to avoid conflict with Next.js
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: sdlc_admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256m

  # ── Arize Phoenix — local LLM tracing fallback ───────────────
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: sdlc-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"   # Phoenix UI
      - "4317:4317"   # OTLP gRPC collector
    volumes:
      - phoenix_data:/root/.phoenix
    environment:
      PHOENIX_WORKING_DIR: /root/.phoenix
    deploy:
      resources:
        limits:
          memory: 512m

# ── Named volumes — data persists across restarts ────────────
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  phoenix_data: